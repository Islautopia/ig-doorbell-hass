<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>IG Doorbell · Secure connection</title>
<link rel="icon" href="/ig_doorbell/https/logo.png">
<style>
  :root {
    --ig-lime:#78C800; --ig-cyan:#00C4D4; --ig-blue:#1976D2; --ig-blue-dark:#1565C0;
    --ig-bg:#070D1A; --ig-surf1:#0D1B2E; --ig-surf2:#162336; --ig-surf3:#1D2D42;
    --ig-text:#E8F0FE; --ig-muted:#94A3B8; --ig-dim:#64748B; --ig-faint:#334155;
    --ig-green:#4CAF50; --ig-red:#EF5350; --ig-amber:#FFB300;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ig-bg); color: var(--ig-text); }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  header img { width: 52px; height: 52px; flex: none; }
  header .brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ig-cyan); font-weight: 600; }
  h1 { font-size: 24px; line-height: 1.25; margin: 2px 0 0; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .lead { color: var(--ig-muted); margin: 12px 0 20px; }
  .card { background: var(--ig-surf1); border: 1px solid var(--ig-faint); border-radius: 16px; padding: 18px; margin: 0 0 16px; }
  .card.warn { border-color: var(--ig-amber); }
  .card.bad { border-color: var(--ig-red); }
  .muted { color: var(--ig-muted); font-size: 14px; }
  .addr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; word-break: break-all;
          background: var(--ig-surf2); border-radius: 10px; padding: 10px 12px; margin: 8px 0 12px; display: block; color: var(--ig-text); text-decoration: none; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .tabs button { font: inherit; font-size: 14px; color: var(--ig-muted); background: var(--ig-surf2); border: 1px solid var(--ig-faint);
                 border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { color: var(--ig-bg); background: var(--ig-cyan); border-color: var(--ig-cyan); font-weight: 600; }
  .big { display: block; width: 100%; text-align: center; font: inherit; font-size: 17px; font-weight: 700; color: #fff;
         background: linear-gradient(135deg, var(--ig-blue), var(--ig-cyan)); border: 0; border-radius: 14px; padding: 16px 18px;
         text-decoration: none; cursor: pointer; margin: 6px 0 16px; }
  .big.secondary { background: var(--ig-surf3); color: var(--ig-text); border: 1px solid var(--ig-faint); font-weight: 600; }
  .big.check { background: linear-gradient(135deg, #5a9900, var(--ig-lime)); color: #0b1400; }
  .big:disabled { opacity: .6; cursor: progress; }
  ol { margin: 0 0 12px; padding-inline-start: 22px; }
  ol li { margin: 0 0 10px; }
  b { color: #fff; }
  .result { display: none; border-radius: 12px; padding: 14px 16px; margin: 4px 0 0; }
  .result.ok { display: block; background: rgba(76,175,80,.12); border: 1px solid var(--ig-green); }
  .result.fail { display: block; background: rgba(239,83,80,.10); border: 1px solid var(--ig-red); }
  .result h3 { margin: 0 0 6px; font-size: 17px; }
  .qr { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .qr img { width: 168px; height: 168px; background: #fff; border-radius: 12px; padding: 6px; flex: none; }
  .qr p { flex: 1 1 200px; margin: 0; }
  details { margin-top: 8px; }
  details summary { cursor: pointer; color: var(--ig-muted); font-size: 14px; }
  details .fp { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; color: var(--ig-muted); }
  dl { margin: 10px 0 0; font-size: 14px; }
  dt { color: var(--ig-muted); margin-top: 8px; }
  dd { margin: 2px 0 0; }
  .note { border-inline-start: 3px solid var(--ig-cyan); padding: 2px 0 2px 12px; color: var(--ig-muted); font-size: 14px; margin: 0 0 12px; }
  footer { color: var(--ig-dim); font-size: 12px; text-align: center; margin-top: 28px; }
  select { font: inherit; font-size: 13px; background: var(--ig-surf2); color: var(--ig-muted); border: 1px solid var(--ig-faint); border-radius: 8px; padding: 2px 6px; }
  [hidden] { display: none !important; }
  @media (max-width: 380px) { h1 { font-size: 21px; } .qr img { width: 140px; height: 140px; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="/ig_doorbell/https/logo.png" alt="">
    <div>
      <div class="brand">IG Doorbell</div>
      <h1 data-t="title"></h1>
    </div>
  </header>
  <p class="lead" data-t="lead"></p>

  <div id="loading" class="card"><p class="muted" data-t="loading"></p></div>

  <div id="off" class="card warn" hidden>
    <h2 data-t="off_title"></h2>
    <p data-t="off_body"></p>
  </div>

  <div id="down" class="card bad" hidden>
    <h2 data-t="down_title"></h2>
    <p id="down_body"></p>
  </div>

  <section id="public" class="card" hidden>
    <h2 data-t="pub_title"></h2>
    <p data-t="pub_body"></p>
    <a id="pub_url" class="addr" href="#"></a>
    <button id="pub_check" class="big secondary" type="button" data-t="check_btn"></button>
    <div id="pub_result" class="result"></div>
    <p class="note" data-t="pub_note"></p>
  </section>

  <section id="local" class="card" hidden>
    <h2 id="local_title"></h2>
    <p data-t="local_body"></p>

    <div class="tabs" role="group">
      <button type="button" data-dev="ios" data-t="dev_ios"></button>
      <button type="button" data-dev="android" data-t="dev_android"></button>
      <button type="button" data-dev="desktop" data-t="dev_desktop"></button>
    </div>

    <div id="qr" class="qr" hidden>
      <img id="qr_img" alt="QR">
      <p data-t="desktop_qr"></p>
    </div>

    <div data-for="ios" hidden>
      <a class="big" href="/ig_doorbell/https/root.mobileconfig" data-t="btn_ios"></a>
      <ol data-list="ios_steps"></ol>
    </div>
    <div data-for="android" hidden>
      <a class="big" href="/ig_doorbell/https/root.crt" download="ig-doorbell-ha-root.crt" data-t="btn_download"></a>
      <ol data-list="android_steps"></ol>
      <p class="note" data-t="android_note"></p>
    </div>
    <div data-for="desktop" hidden>
      <p style="margin-top:16px" data-t="desktop_this"></p>
      <a class="big" href="/ig_doorbell/https/root.crt" download="ig-doorbell-ha-root.crt" data-t="btn_download"></a>
      <div class="tabs" role="group">
        <button type="button" data-os="win">Windows</button>
        <button type="button" data-os="mac">macOS</button>
        <button type="button" data-os="linux">Linux · ChromeOS</button>
      </div>
      <ol data-os-list="win" data-list="win_steps" hidden></ol>
      <ol data-os-list="mac" data-list="mac_steps" hidden></ol>
      <ol data-os-list="linux" data-list="linux_steps" hidden></ol>
      <p class="note" data-t="firefox_note"></p>
    </div>

    <button id="check" class="big check" type="button" data-t="check_btn"></button>
    <div id="result" class="result"></div>

    <details>
      <summary data-t="details"></summary>
      <dl>
        <dt data-t="d_addr"></dt><dd id="d_addr"></dd>
        <dt data-t="d_name"></dt><dd id="d_name"></dd>
        <dt data-t="d_fp"></dt><dd class="fp" id="d_fp"></dd>
        <dt data-t="d_scope_t"></dt><dd id="d_scope"></dd>
        <dt data-t="d_key_t"></dt><dd data-t="d_key"></dd>
      </dl>
    </details>
  </section>

  <p class="note" data-t="remote_note"></p>

  <footer>
    <span>IG Doorbell · Islautopia</span> ·
    <select id="lang" aria-label="Language"></select>
  </footer>
</main>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang = 'en', S = null, device = 'desktop', os = 'win';

function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  const wanted = [q, ...(navigator.languages || [navigator.language])].filter(Boolean);
  for (const w of wanted) { const k = w.toLowerCase().slice(0, 2); if (T[k]) return k; }
  return 'en';
}
function t(key, vars) {
  let v = (T[lang] && T[lang][key] !== undefined) ? T[lang][key] : T.en[key];
  if (typeof v === 'string' && vars) for (const [k, x] of Object.entries(vars)) v = v.split('{' + k + '}').join(esc(x));
  return v;
}
function vars() { return { ca: (S && S.ca_name) || 'IG Doorbell Home Assistant Local CA', port: (S && S.port) || 8443 }; }

function detect() {
  const ua = navigator.userAgent || '';
  const iPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  if (/iPhone|iPad|iPod/.test(ua) || iPadOS) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}
function detectOs() {
  const p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent;
  if (/Mac/i.test(p)) return 'mac';
  if (/Linux|CrOS|X11/i.test(p)) return 'linux';
  return 'win';
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = 'ltr'; // none of the six languages (es/en/fr/it/de/pt) are RTL
  const v = vars();
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t(el.dataset.t, v); });
  document.querySelectorAll('[data-list]').forEach((ol) => {
    ol.innerHTML = (t(ol.dataset.list) || []).map((s) => '<li>' + s.split('{ca}').join(esc(v.ca)) + '</li>').join('');
  });
  document.querySelectorAll('.tabs [data-dev]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.dev === device)));
  document.querySelectorAll('[data-for]').forEach((d) => { d.hidden = d.dataset.for !== device; });
  document.querySelectorAll('.tabs [data-os]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.os === os)));
  document.querySelectorAll('[data-os-list]').forEach((d) => { d.hidden = d.dataset.osList !== os; });
  $('qr').hidden = device !== 'desktop';
  if (S) fill();
}

function fill() {
  const v = vars();
  $('loading').hidden = true;
  $('off').hidden = !!S.enabled;
  $('down').hidden = !(S.enabled && !S.running);
  if (S.enabled && !S.running) $('down_body').innerHTML = S.error === 'port_in_use' ? t('down_port', v) : t('down_other', v);
  const pubOk = S.running && S.public && S.public.url;
  $('public').hidden = !pubOk;
  if (pubOk) { $('pub_url').textContent = S.public.url; $('pub_url').href = S.public.url; }
  $('local').hidden = !S.running;
  $('local_title').textContent = pubOk ? t('local_title_alt') : t('local_title');
  $('d_addr').innerHTML = (S.local_urls || []).map(esc).join('<br>');
  $('d_name').textContent = S.ca_name || '';
  $('d_fp').textContent = S.fingerprint || '';
  $('d_scope').textContent = S.constrained === false ? t('d_scope_none') : t('d_scope');
  if (!$('qr_img').src) $('qr_img').src = '/ig_doorbell/https/qr.svg';
}

// The address to test is the one THIS device would use: the host it opened this page with, on
// the HTTPS port. A device that reached Home Assistant as homeassistant.local tests that name.
function localTarget() {
  const host = location.hostname;
  const port = S.port;
  const h = host.includes(':') ? '[' + host + ']' : host;
  return 'https://' + h + ':' + port;
}

async function probe(base) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(base + '/ig_doorbell/https/check', { cache: 'no-store', mode: 'cors', signal: ctl.signal });
    const j = await r.json();
    return !!(j && j.ok && j.secure);
  } catch (e) {
    return false;
  } finally { clearTimeout(timer); }
}

function showResult(box, ok, url, failHtml) {
  box.className = 'result ' + (ok ? 'ok' : 'fail');
  if (ok) {
    box.innerHTML = '<h3>' + esc(t('ok_title')) + '</h3><p>' + t('ok_body') + '</p><a class="addr" href="' + esc(url) + '">' + esc(url) + '</a>' +
      '<a class="big" href="' + esc(url) + '">' + esc(t('ok_open')) + '</a>';
  } else {
    box.innerHTML = '<h3>' + esc(t('fail_title')) + '</h3><p>' + failHtml + '</p>';
  }
}

async function runCheck() {
  const btn = $('check'); btn.disabled = true; btn.textContent = t('checking');
  const url = localTarget();
  const ok = await probe(url);
  btn.disabled = false; btn.textContent = t('check_btn');
  if (ok && location.protocol === 'https:' && window.isSecureContext && location.port === String(S.port)) {
    const box = $('result'); box.className = 'result ok';
    box.innerHTML = '<h3>' + esc(t('ok_title')) + '</h3><p>' + esc(t('ok_here')) + '</p>';
    return;
  }
  const v = vars();
  const why = device === 'ios' ? t('fail_ios', v) : device === 'android' ? t('fail_android', v) : t('fail_desktop', v);
  showResult($('result'), ok, url, why + '</p><p class="muted">' + t('fail_port', v));
}

async function runPubCheck() {
  const btn = $('pub_check'); btn.disabled = true; btn.textContent = t('checking');
  const ok = await probe(S.public.url);
  btn.disabled = false; btn.textContent = t('check_btn');
  showResult($('pub_result'), ok, S.public.url, t('pub_fail'));
}

async function load() {
  try {
    const r = await fetch('/ig_doorbell/https/status', { cache: 'no-store' });
    S = await r.json();
  } catch (e) { S = { enabled: false, running: false }; }
  render();
}

lang = pickLang(); device = detect(); os = detectOs();
const sel = $('lang');
sel.innerHTML = Object.entries(T).map(([k, v]) => '<option value="' + k + '"' + (k === lang ? ' selected' : '') + '>' + esc(v._name) + '</option>').join('');
sel.addEventListener('change', () => { lang = sel.value; render(); });
document.querySelectorAll('.tabs [data-dev]').forEach((b) => b.addEventListener('click', () => { device = b.dataset.dev; render(); }));
document.querySelectorAll('.tabs [data-os]').forEach((b) => b.addEventListener('click', () => { os = b.dataset.os; render(); }));
$('check').addEventListener('click', runCheck);
$('pub_check').addEventListener('click', runPubCheck);
render();
load();
</script>
